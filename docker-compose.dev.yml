services:
  db:
    image: postgres:15
    container_name: lora-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lora
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: lora-dev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/containers/dev.Dockerfile
      target: development
      args:
        PYTHON_VERSION: "3.11"
        INSTALL_ML: ${INSTALL_ML:-false}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: lora-dev-api
    command: ["uvicorn", "backend.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backend:/app/backend
      - ./app:/app/app
      - ${LORA_HOST_DIR:-./loras}:/app/loras
      - ./outputs:/app/outputs
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/lora}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:5173}
      API_KEY: ${API_KEY:-dev-token}
      # Empty disables generation; use http://host.docker.internal:7860 for an
      # SDNext running on the host, or http://sdnext:7860 with the `ml` profile.
      SDNEXT_BASE_URL: ${SDNEXT_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: app/frontend/containers/dev.Dockerfile
      target: development
      args:
        NODE_VERSION: "20"
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: lora-dev-frontend
    working_dir: /usr/src/app
    volumes:
      - ./app/frontend:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://api:8000}
      VITE_BACKEND_API_KEY: ${VITE_BACKEND_API_KEY:-dev-token}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  sdnext:
    image: vladmandic/automatic:latest
    container_name: lora-dev-sdnext
    profiles:
      - ml
    ports:
      - "7860:7860"
    environment:
      COMMANDLINE_ARGS: --listen --port 7860 --api --cors-allow-origins=* --enable-insecure-extension-access
    volumes:
      - ${LORA_HOST_DIR:-./loras}:/app/models/lora
      - sdnext_data:/app/repositories
      - sdnext_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/sdapi/v1/options"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s


  # Reviewer demo: explicit services, isolated volumes, no host data mounts.
  demo-db:
    image: postgres:15.10
    profiles: [demo]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-redis:
    image: redis:7.4.2
    profiles: [demo]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - demo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-api:
    image: lora-review-demo:local
    profiles: [demo]
    build:
      context: .
      dockerfile: backend/containers/dev.Dockerfile
      target: demo
      args:
        PYTHON_VERSION: "3.11"
        INSTALL_ML: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &demo-environment
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://demo:demo@demo-db:5432/demo
      REDIS_URL: redis://demo-redis:6379/0
      API_KEY: demo-token
      SDNEXT_BASE_URL: ${DEMO_SDNEXT_BASE_URL:-http://sdnext-simulator:7860}
      SDNEXT_TIMEOUT: ${DEMO_SDNEXT_TIMEOUT:-3}
      SDNEXT_OUTPUT_DIR: /app/outputs
      IMPORT_ON_STARTUP: "false"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - demo_outputs:/app/outputs
    depends_on:
      demo-db:
        condition: service_healthy
      demo-redis:
        condition: service_healthy
      sdnext-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-worker:
    image: lora-review-demo:local
    profiles: [demo]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *demo-environment
    command: ["rq", "worker", "--url", "redis://demo-redis:6379/0", "default"]
    volumes:
      - demo_outputs:/app/outputs
    depends_on:
      demo-api:
        condition: service_healthy

  sdnext-simulator:
    image: lora-review-demo:local
    profiles: [demo]
    command: ["uvicorn", "scripts.demo.simulator:app", "--host", "0.0.0.0", "--port", "7860"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/sdapi/v1/options"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  demo_postgres:
  demo_redis:
  demo_outputs:
  postgres_data:
  node_modules:
  sdnext_data:
  sdnext_outputs:
